name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    uses: Macro-Deck-App/GitHub-Actions/.github/workflows/publish-plugin.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ github.event.release.tag_name }}
      source: macrodeck-plugin/src/VesktopBridge.Plugin
      changelog: ${{ github.event.release.body }}
      # Platform minimum is 3.0.0-beta.15; the setup action's default is older.
      cli-version: 3.0.0-beta.15
